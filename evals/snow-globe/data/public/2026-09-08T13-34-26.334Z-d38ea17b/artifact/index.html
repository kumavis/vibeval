<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snow Globe</title><style>*{margin:0;padding:0;box-sizing:border-box}body{width:100vw;height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{display:block;width:100%;height:100%}#info{position:absolute;top:20px;left:20px;color:white;font-size:14px;text-shadow:2px 2px 8px rgba(0,0,0,0.5);z-index:10}</style></head><body><div id="info"><strong>Snow Globe</strong><br>Drag to rotate</div><canvas id="canvas"></canvas><script>class Point3D{constructor(x,y,z){this.x=x;this.y=y;this.z=z}rotateX(angle){const cos=Math.cos(angle),sin=Math.sin(angle),y=this.y*cos-this.z*sin,z=this.y*sin+this.z*cos;this.y=y;this.z=z}rotateY(angle){const cos=Math.cos(angle),sin=Math.sin(angle),x=this.x*cos+this.z*sin,z=-this.x*sin+this.z*cos;this.x=x;this.z=z}project(fov,width,height){const scale=fov/(fov+this.z*0.5),x2d=this.x*scale*100+width/2,y2d=this.y*scale*100+height/2;return{x:x2d,y:y2d,scale:scale,z:this.z}}}class SnowGlobe{constructor(){this.canvas=document.getElementById('canvas');this.ctx=this.canvas.getContext('2d');this.rotation={x:0,y:0};this.mouse={x:0,y:0};this.isDragging=false;this.resizeCanvas();this.createSnowParticles();this.setupControls();this.animate()}resizeCanvas(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;window.addEventListener('resize',()=>this.resizeCanvas())}createSnowParticles(){this.snowParticles=[];for(let i=0;i<400;i++){this.snowParticles.push({x:(Math.random()-0.5)*8,y:(Math.random()-0.5)*6,z:(Math.random()-0.5)*6,vx:(Math.random()-0.5)*0.02,vy:-0.01-Math.random()*0.01,vz:(Math.random()-0.5)*0.02})}}setupControls(){document.addEventListener('mousedown',(e)=>this.onMouseDown(e));document.addEventListener('mousemove',(e)=>this.onMouseMove(e));document.addEventListener('mouseup',()=>this.onMouseUp());document.addEventListener('touchstart',(e)=>this.onTouchStart(e));document.addEventListener('touchmove',(e)=>this.onTouchMove(e));document.addEventListener('touchend',()=>this.onMouseUp())}onMouseDown(e){this.isDragging=true;this.mouse.x=e.clientX;this.mouse.y=e.clientY}onMouseMove(e){if(this.isDragging){const dx=e.clientX-this.mouse.x,dy=e.clientY-this.mouse.y;this.rotation.y+=dx*0.01;this.rotation.x+=dy*0.01;this.mouse.x=e.clientX;this.mouse.y=e.clientY}}onMouseUp(){this.isDragging=false}onTouchStart(e){if(e.touches.length>0){this.isDragging=true;this.mouse.x=e.touches[0].clientX;this.mouse.y=e.touches[0].clientY}}onTouchMove(e){if(this.isDragging&&e.touches.length>0){const dx=e.touches[0].clientX-this.mouse.x,dy=e.touches[0].clientY-this.mouse.y;this.rotation.y+=dx*0.01;this.rotation.x+=dy*0.01;this.mouse.x=e.touches[0].clientX;this.mouse.y=e.touches[0].clientY}}drawGlobe(){const cx=this.canvas.width/2,cy=this.canvas.height/2,r=Math.min(this.canvas.width,this.canvas.height)/2.5;this.ctx.fillStyle='rgba(179,229,252,0.25)';this.ctx.beginPath();this.ctx.arc(cx,cy,r,0,Math.PI*2);this.ctx.fill();this.ctx.strokeStyle='rgba(100,150,200,0.4)';this.ctx.lineWidth=3;this.ctx.stroke()}drawBase(){const cx=this.canvas.width/2,cy=this.canvas.height/2,r=Math.min(this.canvas.width,this.canvas.height)/2.5;this.ctx.fillStyle='#8B4513';this.ctx.fillRect(cx-r*0.85,cy+r-25,r*1.7,50);this.ctx.fillStyle='#654321';this.ctx.fillRect(cx-r*1.05,cy+r+25,r*2.1,35)}drawMountain(){const cx=this.canvas.width/2,cy=this.canvas.height/2,r=Math.min(this.canvas.width,this.canvas.height)/2.5;const pts=[new Point3D(0,2,0),new Point3D(-1.5,-1,-0.5),new Point3D(1.5,-1,-0.5),new Point3D(0,-1,1.5)];pts.forEach(p=>{p.rotateX(this.rotation.x);p.rotateY(this.rotation.y)});const proj=pts.map(p=>p.project(800,this.canvas.width,this.canvas.height));this.ctx.fillStyle='rgba(255,255,255,0.95)';this.ctx.beginPath();this.ctx.moveTo(proj[0].x,proj[0].y);this.ctx.lineTo(proj[1].x,proj[1].y);this.ctx.lineTo(proj[2].x,proj[2].y);this.ctx.closePath();this.ctx.fill();this.ctx.fillStyle='rgba(100,100,100,0.8)';this.ctx.beginPath();this.ctx.moveTo(proj[0].x,proj[0].y);this.ctx.lineTo(proj[2].x,proj[2].y);this.ctx.lineTo(proj[3].x,proj[3].y);this.ctx.closePath();this.ctx.fill()}drawSnow(){this.ctx.fillStyle='rgba(255,255,255,0.85)';const cx=this.canvas.width/2,cy=this.canvas.height/2,r=Math.min(this.canvas.width,this.canvas.height)/2.5;const rsq=r*r;this.snowParticles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;if(p.y<-3){p.y=3;p.x=(Math.random()-0.5)*8;p.z=(Math.random()-0.5)*6}if(p.x>4||p.x<-4)p.x=-p.x*0.5;if(p.z>4||p.z<-4)p.z=-p.z*0.5;let px=p.x,py=p.y,pz=p.z;const cosx=Math.cos(this.rotation.x),sinx=Math.sin(this.rotation.x);let npy=py*cosx-pz*sinx;let npz=py*sinx+pz*cosx;py=npy;pz=npz;const cosy=Math.cos(this.rotation.y),siny=Math.sin(this.rotation.y);let npx=px*cosy+pz*siny;npz=-px*siny+pz*cosy;px=npx;pz=npz;const scale=4/(4+pz*0.3),x2d=cx+px*scale*50,y2d=cy+py*scale*50,dx=x2d-cx,dy=y2d-cy;if(dx*dx+dy*dy<rsq){this.ctx.beginPath();this.ctx.arc(x2d,y2d,2,0,Math.PI*2);this.ctx.fill()}});if(this.snowParticles.length===0){for(let i=0;i<400;i++){this.snowParticles.push({x:(Math.random()-0.5)*8,y:3,z:(Math.random()-0.5)*6,vx:(Math.random()-0.5)*0.02,vy:-0.01-Math.random()*0.01,vz:(Math.random()-0.5)*0.02})}}}animate=()=>{this.ctx.fillStyle='#667eea';this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);this.drawGlobe();this.drawBase();this.drawMountain();this.drawSnow();requestAnimationFrame(this.animate)}}new SnowGlobe()</script></body></html>
