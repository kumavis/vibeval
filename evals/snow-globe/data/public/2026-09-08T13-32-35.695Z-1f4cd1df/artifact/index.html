<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Snow Globe — Alpine Stillness</title>
<style>
  :root{--ink:#10253a;--muted:#597082;--ice:#eaf8ff;--line:rgba(255,255,255,.62)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 15%,#294b70 0,#142b48 43%,#09192d 100%);font-family:ui-serif,Georgia,serif;color:#eef8ff}
  .sky-stars,.snow{position:fixed;inset:0;pointer-events:none}.sky-stars{background-image:radial-gradient(circle,#fff 0 1px,transparent 1.7px),radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:103px 127px,173px 151px;background-position:12px 4px,64px 58px;opacity:.5}.snow{z-index:5;background-image:radial-gradient(circle at center,#fff 0 1.5px,transparent 2px),radial-gradient(circle at center,#fff 0 1px,transparent 1.5px);background-size:71px 71px,117px 117px;background-position:0 0,30px 17px;opacity:.45;animation:fall 13s linear infinite}@keyframes fall{to{background-position:20px 740px,-18px 600px}}
  main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px}.title{position:fixed;top:34px;text-align:center;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 18px #08182c}.title small{display:block;font:600 10px ui-sans-serif,system-ui;letter-spacing:.24em;color:#b6d8e8;margin-bottom:8px}.title h1{font-weight:400;font-size:clamp(22px,3vw,36px);margin:0}
  .stage{width:min(760px,92vw);height:min(760px,72vh);min-height:490px;position:relative;perspective:1100px;display:grid;place-items:center}.globe-wrap{width:min(520px,75vw);aspect-ratio:1/1;position:relative;transform-style:preserve-3d;cursor:grab;touch-action:none;filter:drop-shadow(0 28px 30px rgba(0,0,0,.38))}.globe-wrap.dragging{cursor:grabbing}.globe{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#bce5f3 0%,#80bfd4 44%,#d6f2fa 45%,#c7e5ed 100%);border:2px solid rgba(235,251,255,.88);box-shadow:inset 18px 18px 35px rgba(255,255,255,.55),inset -25px -15px 40px rgba(27,80,109,.28),0 0 0 9px rgba(163,222,240,.13);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;will-change:transform}
  .scene{position:absolute;inset:0;transform-style:preserve-3d}.aurora{position:absolute;left:7%;top:10%;width:90%;height:45%;background:radial-gradient(ellipse at 50% 80%,rgba(220,255,255,.88),transparent 23%),radial-gradient(ellipse at 25% 55%,rgba(114,233,205,.46),transparent 42%),radial-gradient(ellipse at 80% 35%,rgba(111,171,239,.5),transparent 40%);filter:blur(10px);transform:translateZ(-35px)}
  .mountain{position:absolute;bottom:28%;left:50%;width:0;height:0;border-left:132px solid transparent;border-right:132px solid transparent;border-bottom:235px solid #456f88;transform:translateX(-50%) translateZ(-5px);filter:drop-shadow(7px 9px 6px rgba(21,55,78,.22))}.mountain:before{content:"";position:absolute;left:-132px;top:0;border-left:132px solid transparent;border-right:132px solid transparent;border-bottom:96px solid #f7ffff;clip-path:polygon(50% 0,100% 100%,58% 76%,42% 88%,0 100%)}.mountain:after{content:"";position:absolute;left:-8px;top:53px;width:8px;height:115px;background:#274f6a;transform:skewX(-27deg);opacity:.7}
  .mountain.back{left:27%;bottom:29%;transform:translateX(-50%) translateZ(-50px) scale(.67);opacity:.72;border-bottom-color:#608aa1}.mountain.back.two{left:74%;bottom:30%;transform:translateX(-50%) translateZ(-45px) scale(.56)}
  .ground{position:absolute;width:125%;height:42%;left:-12.5%;bottom:-9%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 18%,#fff 0 18%,#d9f4f7 48%,#a7d6dd 78%);transform:translateZ(15px)}
  .tree{position:absolute;bottom:27%;width:46px;height:118px;transform:translateZ(30px)}.tree:before{content:"";position:absolute;bottom:0;left:20px;width:8px;height:34px;background:#684d3c;border-radius:3px}.tree:after{content:"";position:absolute;bottom:21px;border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:78px solid #164f59;filter:drop-shadow(0 2px 0 #d9fcff);clip-path:polygon(50% 0,100% 100%,71% 88%,100% 100%,0 100%,29% 88%,0 100%)}.t1{left:16%;transform:translateZ(40px) scale(.8)}.t2{right:13%;transform:translateZ(42px) scale(1.05)}.t3{right:29%;bottom:25%;transform:translateZ(22px) scale(.57)}
  .flakes{position:absolute;inset:0;transform-style:preserve-3d}.flake{position:absolute;width:5px;height:5px;background:white;border-radius:50%;box-shadow:0 0 5px white;animation:float var(--d) ease-in-out infinite alternate;transform:translateZ(var(--z))}.flake:nth-child(1){left:23%;top:24%;--z:65px;--d:2.7s}.flake:nth-child(2){left:71%;top:31%;--z:70px;--d:3.5s}.flake:nth-child(3){left:41%;top:17%;--z:48px;--d:2.3s}.flake:nth-child(4){left:80%;top:55%;--z:57px;--d:3.1s}.flake:nth-child(5){left:13%;top:53%;--z:40px;--d:2.8s}.flake:nth-child(6){left:55%;top:43%;--z:88px;--d:3.8s}.flake:nth-child(7){left:34%;top:64%;--z:55px;--d:2.4s}.flake:nth-child(8){left:64%;top:70%;--z:42px;--d:3.2s}@keyframes float{to{margin-top:22px;margin-left:9px;opacity:.28}}
  .shine{position:absolute;inset:0;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 29% 18%,rgba(255,255,255,.83) 0 3%,rgba(255,255,255,.25) 7%,transparent 22%),linear-gradient(112deg,rgba(255,255,255,.21) 0 10%,transparent 20% 73%,rgba(255,255,255,.2) 100%);mix-blend-mode:screen}.rim{position:absolute;inset:-5px;border:5px solid rgba(228,250,255,.32);border-radius:50%;z-index:6;pointer-events:none}
  .base{position:absolute;width:76%;height:106px;bottom:-38px;left:12%;z-index:8;border-radius:48% 48% 18px 18px;background:linear-gradient(90deg,#6d3d27,#b47545 18%,#e2af72 48%,#935431 78%,#5c3022);border:2px solid rgba(255,219,165,.48);box-shadow:inset 0 11px 13px rgba(255,227,174,.28),inset 0 -15px 17px rgba(58,22,13,.35),0 12px 17px rgba(0,0,0,.35)}.base:before{content:"";position:absolute;inset:13px 13% auto;height:12px;border-radius:50%;background:rgba(68,31,18,.42)}.base span{position:absolute;bottom:17px;width:100%;text-align:center;color:#ffe5b5;font:600 11px ui-serif,Georgia,serif;letter-spacing:.25em;text-transform:uppercase;text-shadow:0 1px #63371f}
  .hint{position:fixed;bottom:26px;display:flex;gap:12px;align-items:center;color:#c8e5f0;font:500 12px ui-sans-serif,system-ui;letter-spacing:.08em;text-transform:uppercase}.hint i{display:inline-block;width:28px;height:18px;border:1px solid #c8e5f0;border-radius:12px;position:relative}.hint i:after{content:"";position:absolute;width:4px;height:4px;border:1px solid #c8e5f0;border-radius:50%;left:7px;top:6px}.hint b{font-weight:500}@media(max-width:520px){.stage{min-height:420px;height:65vh}.base{height:82px;bottom:-28px}.base span{bottom:13px;font-size:9px}.title{top:21px}.hint{bottom:16px;font-size:10px}}
</style>
</head>
<body>
<div class="sky-stars"></div><div class="snow"></div>
<main>
  <header class="title"><small>Winter collection / No. 07</small><h1>Alpine Stillness</h1></header>
  <section class="stage" aria-label="Interactive 3D snow globe"><div class="globe-wrap" id="wrap"><div class="globe" id="globe">
    <div class="scene"><div class="aurora"></div><div class="mountain back"></div><div class="mountain back two"></div><div class="mountain"></div><div class="ground"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="flakes"><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i></div></div>
    <div class="shine"></div><div class="rim"></div></div><div class="base"><span>Mountain air</span></div></div></section>
  <div class="hint"><i></i><b>Drag to turn the globe</b></div>
</main>
<script>
(()=>{const w=document.getElementById('wrap'),g=document.getElementById('globe');let active=false,x=0,y=0,rx=0,ry=0,tx=0,ty=0;function render(){rx+=(tx-rx)*.1;ry+=(ty-ry)*.1;g.style.setProperty('--rx',rx+'deg');g.style.setProperty('--ry',ry+'deg');requestAnimationFrame(render)}render();function down(e){active=true;w.classList.add('dragging');const p=e.touches?e.touches[0]:e;x=p.clientX;y=p.clientY}function move(e){if(!active)return;const p=e.touches?e.touches[0]:e;ty=Math.max(-18,Math.min(18,ty-(p.clientY-y)*.16));tx=Math.max(-30,Math.min(30,tx+(p.clientX-x)*.16));x=p.clientX;y=p.clientY}function up(){active=false;w.classList.remove('dragging')}w.addEventListener('pointerdown',down);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);w.addEventListener('pointerleave',up);})();
</script>
</body></html>
