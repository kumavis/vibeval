<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpine Globe</title>
<style>
  :root{--ink:#10233c;--blue:#7ed4ff;--deep:#1b5d96;--snow:#f8fdff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 50% 30%,#dff6ff 0 18%,#9fdafa 48%,#327db5 100%);font-family:ui-rounded,system-ui,sans-serif;color:var(--ink);user-select:none}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.45}body:before{width:42vw;height:42vw;left:-10vw;bottom:-15vw;background:#d6f4ff}body:after{width:35vw;height:35vw;right:-8vw;top:-14vw;background:#fff}
  header{position:fixed;top:0;left:0;width:100%;padding:28px 34px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}header>*{pointer-events:auto}.brand{font-weight:800;letter-spacing:.18em;font-size:13px;text-transform:uppercase}.hint{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:9px;box-shadow:0 0 12px #fff}
  main{height:100%;display:grid;place-items:center;perspective:1100px}.stage{width:min(76vw,700px);height:min(76vw,700px);display:grid;place-items:center;transform-style:preserve-3d}.globe-wrap{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;cursor:grab;filter:drop-shadow(0 34px 25px rgba(13,47,79,.28))}.globe-wrap:active{cursor:grabbing}
  .globe{position:absolute;inset:4.5%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#dff7ff 0%,#84cdf3 55%,#579ed0 100%);border:2px solid rgba(255,255,255,.85);box-shadow:inset 24px 13px 48px rgba(255,255,255,.55),inset -26px -18px 48px rgba(15,81,135,.3),0 0 0 5px rgba(255,255,255,.12);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .08s linear}
  .sky{position:absolute;inset:0;background:radial-gradient(ellipse at 58% 24%,#fff 0 3%,rgba(255,255,255,.7) 4%,transparent 16%),linear-gradient(#72bde9 0%,#bde8fc 54%,#effbff 55%)}.sun{position:absolute;left:58%;top:17%;width:11%;aspect-ratio:1;border-radius:50%;background:#fff9ce;box-shadow:0 0 35px 11px rgba(255,247,190,.55)}
  .mountains{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(0)}.mountain{position:absolute;bottom:22%;clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:bottom}.back{width:65%;height:49%;left:-8%;background:linear-gradient(105deg,#4d81a5,#204f76);opacity:.7}.back2{width:60%;height:44%;right:-11%;background:linear-gradient(75deg,#6997b5,#315b7a);opacity:.75}.peak{width:62%;height:66%;left:19%;background:linear-gradient(105deg,#d7edf6 0 49%,#91b9cd 50% 100%);filter:drop-shadow(0 10px 3px rgba(16,64,99,.23))}.peak:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 0 35%,#fff 36% 51%,transparent 52%),linear-gradient(60deg,transparent 0 60%,rgba(255,255,255,.65) 61% 67%,transparent 68%)}.ground{position:absolute;left:-10%;right:-10%;bottom:-8%;height:34%;background:radial-gradient(ellipse at 52% 0%,#fff 0 12%,#dff3fb 48%,#b2dbe9 100%);border-radius:50% 50% 0 0}.tree{position:absolute;bottom:17%;width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-bottom:53px solid #175d66;filter:drop-shadow(3px 5px 2px rgba(16,72,80,.18))}.tree:after{content:"";position:absolute;width:6px;height:16px;background:#5b4a39;left:-3px;top:51px}.t1{left:17%;transform:scale(.9)}.t2{left:30%;bottom:19%;transform:scale(1.25)}.t3{right:17%;transform:scale(.82)}.t4{right:30%;bottom:18%;transform:scale(1.05)}
  .snow{position:absolute;inset:0;overflow:hidden;z-index:3}.flake{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:var(--o);left:var(--x);top:var(--y);box-shadow:0 0 4px #fff;animation:fall var(--d) linear infinite;animation-delay:var(--delay)}@keyframes fall{to{transform:translate3d(var(--drift),140px,0);opacity:.2}}
  .glass{position:absolute;inset:0;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.84) 0 2%,rgba(255,255,255,.38) 2.2% 7%,transparent 17%),linear-gradient(118deg,rgba(255,255,255,.34) 0 8%,transparent 22% 72%,rgba(255,255,255,.16) 88%);box-shadow:inset 4px 4px 5px rgba(255,255,255,.9),inset -20px -20px 35px rgba(35,103,147,.18)}
  .base{position:absolute;z-index:5;bottom:-5%;left:17%;width:66%;height:18%;border-radius:50% 50% 26% 26% / 35% 35% 55% 55%;background:linear-gradient(#306e98,#164365 50%,#0a2b48);box-shadow:inset 0 8px 9px rgba(255,255,255,.25),0 16px 17px rgba(11,42,64,.25)}.base:before{content:"";position:absolute;inset:17% 7% auto;height:11%;border-radius:50%;background:rgba(255,255,255,.3);filter:blur(2px)}
  .label{position:absolute;z-index:8;bottom:7%;text-align:center;width:100%;color:#dff6ff;font-family:Georgia,serif;font-style:italic;letter-spacing:.1em;font-size:clamp(12px,1.8vw,18px);text-shadow:0 2px 2px #143c5c}.controls{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px}.controls button{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.38);color:#143a5c;border-radius:999px;padding:10px 16px;font:700 11px ui-rounded,system-ui;letter-spacing:.09em;text-transform:uppercase;backdrop-filter:blur(8px);cursor:pointer;transition:.2s}.controls button:hover{background:#fff;transform:translateY(-2px)}
  @media(max-width:600px){header{padding:20px}.hint{display:none}.stage{width:92vw;height:92vw}.base{bottom:-3%}.label{bottom:6%}}
</style>
</head>
<body>
<header><div class="brand">Alpine Globe</div><div class="hint"><span class="dot"></span>drag to explore</div></header>
<main><div class="stage"><div class="globe-wrap" id="wrap"><div class="globe" id="globe"><div class="sky"></div><div class="sun"></div><div class="mountains"><div class="mountain back"></div><div class="mountain back2"></div><div class="mountain peak"></div></div><div class="ground"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="snow" id="snow"></div><div class="glass"></div></div><div class="base"></div><div class="label">Winter's Quiet</div></div></div></main>
<div class="controls"><button id="shake">Shake snow</button><button id="reset">Reset view</button></div>
<script>
const globe=document.getElementById('globe'),wrap=document.getElementById('wrap'),snow=document.getElementById('snow');
for(let i=0;i<85;i++){let f=document.createElement('i');f.className='flake';let s=(Math.random()*4+1).toFixed(1)+'px';f.style.cssText=`--s:${s};--o:${.35+Math.random()*.65};--x:${Math.random()*100}%;--y:${Math.random()*100}%;--d:${3+Math.random()*5}s;--delay:${-Math.random()*7}s;--drift:${(Math.random()-.5)*65}px`;snow.appendChild(f)}
let x=0,y=0,down=false,sx,sy,ox,oy;function apply(){globe.style.setProperty('--rx',y+'deg');globe.style.setProperty('--ry',x+'deg')}wrap.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!down)return;x=Math.max(-18,Math.min(18,ox+(e.clientX-sx)*.12));y=Math.max(-14,Math.min(14,oy-(e.clientY-sy)*.12));apply()});wrap.addEventListener('pointerup',()=>down=false);document.getElementById('reset').onclick=()=>{x=y=0;apply()};document.getElementById('shake').onclick=()=>{snow.animate([{transform:'translateX(-8px)'},{transform:'translateX(9px)'},{transform:'translateX(0)'}],{duration:430,easing:'ease-in-out'});[...snow.children].forEach((f,i)=>{f.animate([{transform:'translateY(0)'},{transform:`translate(${(Math.random()-.5)*90}px,${80+Math.random()*140}px)`},{transform:'translateY(0)'}],{duration:700+Math.random()*500,delay:i*3,easing:'cubic-bezier(.2,.8,.2,1)'})})};
</script>
</body></html>
